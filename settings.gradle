pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven {
            url = "http://repo.boox.com/repository/maven-public/"
            allowInsecureProtocol = true
        }
        maven { url = "https://maven.ghostscript.com" }
    }
}
rootProject.name = "Notable"
include ':app'
// Throwaway spike: can a device-owner app disable the status bar on the Boox? (spikes/device-owner)
include ':spike-device-owner'
project(':spike-device-owner').projectDir = file('spikes/device-owner')
